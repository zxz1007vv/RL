# Reuse robot, joint, actuator, and scene definitions from the locomotion setup.
extends: "config_zgwt.yaml"

paths:
  # play.py exports the currently selected checkpoint to this filename.
  policy_path: "../logs/ZGWT_DANCE/exported/policies/policy.pt"

# Startup: zero torque -> A folds the legs then stands -> B enters RL.
start_in_rl: false
wheel_park_stiffness: 25.0
wheel_park_damping: 2.5
park_wheels_always: true
rl_entry_blend_time: 1.0
startup_sequence:
  enabled: true
  leg_order: ["FAR", "FBL", "RAR", "RBL"]
  fold_duration: 2.0
  stand_duration: 2.0
  fold_abad_pos: [0.0, 0.0, 0.0, 0.0]
  fold_hip_pos: [1.4, 1.4, -1.4, -1.4]
  fold_knee_pos: [-2.4, -2.4, 2.4, 2.4]
  stand_abad_pos: [0.0, 0.0, 0.0, 0.0]
  stand_hip_pos: [0.6, 0.6, -0.6, -0.6]
  stand_knee_pos: [-1.2, -1.2, 1.2, 1.2]

input:
  source: "gamepad"
  gamepad:
    command_profile: "dance"
    start_request: "stand"
    stop_request: "rl"
    max_roll: 0.26
    max_pitch: 0.26
    max_body_yaw: 0.10
    height_center: 0.54
    height_range: 0.14
    min_height: 0.40
    max_height: 0.54
    roll_sign: -1.0
    pitch_sign: -1.0
    height_sign: -1.0
    axis_right_y: 4

commands:
  mode: "body_yaw"
  filter_time_constant: 0.5
  yaw_slew_rate: 0.30
  policy_order:
    - lin_vel_x
    - lin_vel_y
    - body_yaw
    - body_roll
    - body_pitch
    - body_height
  normalization:
    max_abs_yaw: 0.10
    max_abs_roll: 0.26
    max_abs_pitch: 0.26
    min_height: 0.40
    default_height: 0.54
  ranges:
    lin_vel_x: [0.0, 0.0]
    lin_vel_y: [0.0, 0.0]
    body_yaw: [-0.10, 0.10]
    body_roll: [-0.26, 0.26]
    body_pitch: [-0.26, 0.26]
    body_height: [0.40, 0.54]
  pose_defaults:
    body_roll: 0.0
    body_pitch: 0.0
    body_height: 0.54
